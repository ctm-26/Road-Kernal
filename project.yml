# XcodeGen spec. Generates RoadKernel.xcodeproj from the Swift sources so the
# project file never has to be hand-maintained. See SETUP.md.
name: RoadKernel

options:
  bundleIdPrefix: com.roadkernel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone (controller) + iPad (dashboard)

targets:
  RoadKernel:
    type: application
    platform: iOS
    sources:
      - path: RoadKernel
    # Explicit (generated) Info.plist: NSBonjourServices is an array, which can't
    # be expressed as an INFOPLIST_KEY_* build setting.
    info:
      path: RoadKernel/Info.plist
      properties:
        # The #1 first-build crash fix: without this key the app crashes the
        # instant location authorization is requested (docs/ARCHITECTURE.md §1.1).
        NSLocationWhenInUseUsageDescription: "Road Kernel shows your position on the map and attaches it to traffic signals you mark."
        # Required for the iPhone↔iPad telemetry link over MultipeerConnectivity.
        NSLocalNetworkUsageDescription: "Road Kernel links your iPhone and iPad over the local network to share live telemetry."
        NSBonjourServices:
          - _rk-telemetry._tcp
          - _rk-telemetry._udp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roadkernel.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"

  RoadKernelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RoadKernelTests
    dependencies:
      - target: RoadKernel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RoadKernel:
    build:
      targets:
        RoadKernel: all
        RoadKernelTests: [test]
    test:
      targets:
        - RoadKernelTests
